<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Démo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0} body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fbf8f2;color:#1b2430;min-height:100vh;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fbf8f2;color:#0f2a4f;font-weight:800}
  .logo{width:30px;height:30px;border-radius:8px;background:#7c3aed;color:#fff;display:grid;place-items:center;font-weight:800}
  .main{flex:1;padding:16px;display:grid;gap:12px;align-content:start}
  .card{background:#fff;border:1px solid #e2dccf;border-radius:14px;padding:14px}
  .card b{display:block;color:#0f2a4f} .card small{color:#5a6573}
  .note{margin:auto 16px 16px;background:#ffd166;border-radius:12px;padding:12px;font-size:13px;line-height:1.4}
  .note b{display:block;margin-bottom:4px}
  .nav{display:flex;justify-content:space-around;padding:10px;border-top:1px solid #e2dccf;background:#fff;font-size:11px;color:#5a6573}
  .nav span:first-child{color:#7c3aed;font-weight:800}
</style></head><body>
<div class="bar"><span class="logo">S</span>Salon Démo</div>
<div class="main"><div class="card"><b>✂️ Coupe</b><small>30 min · 25 €</small></div><div class="card"><b>💨 Coupe + brushing</b><small>45 min · 38 €</small></div><div class="card"><b>🎨 Coloration</b><small>90 min · 65 €</small></div></div>
<div class="note"><b>Version Flutter en cours de compilation</b>Cet aperçu statique sera remplacé par l’application Flutter dès la compilation (build-apps.ps1).</div>
<div class="nav"><span>Prestation</span><span>Date</span><span>Confirmation</span></div>
</body></html>
